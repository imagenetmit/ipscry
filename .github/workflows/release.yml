name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          check-latest: true

      - name: Test
        run: go test ./... -count=1

      - name: Build Linux executable
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA}"
          fi
          go build -trimpath -ldflags "-X main.appVersion=${version}" -o dist/ipscry-linux-amd64 .

      - name: Package artifact
        run: |
          mkdir -p dist/package
          cp dist/ipscry-linux-amd64 dist/package/ipscry
          cp README.md LICENSE SECURITY.md CHANGELOG.md dist/package/
          tar -czf dist/ipscry-linux-amd64.tar.gz -C dist/package .
          cd dist
          sha256sum ipscry-linux-amd64 > ipscry-linux-amd64.sha256
          sha256sum ipscry-linux-amd64.tar.gz > ipscry-linux-amd64.tar.gz.sha256

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipscry-linux-amd64
          path: |
            dist/ipscry-linux-amd64
            dist/ipscry-linux-amd64.sha256
            dist/ipscry-linux-amd64.tar.gz
            dist/ipscry-linux-amd64.tar.gz.sha256

  release:
    needs: build-linux
    environment:
      name: ${{ vars.RELEASE_SIGNING_ENVIRONMENT }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          check-latest: true

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: ipscry-linux-amd64
          path: dist

      - name: Test
        shell: pwsh
        run: go test ./... -count=1

      - name: Build Windows executable
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "dev-${{ github.sha }}" }
          ./build-windows.ps1 -Version $version

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package artifact
        shell: pwsh
        run: |
          Get-FileHash dist/ipscry.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  ipscry.exe" } |
            Set-Content dist/ipscry.exe.sha256
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item dist/ipscry.exe dist/package/ipscry.exe
          Copy-Item README.md,LICENSE,SECURITY.md,CHANGELOG.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/ipscry-windows-amd64.zip -Force
          Get-FileHash dist/ipscry-windows-amd64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  ipscry-windows-amd64.zip" } |
            Set-Content dist/ipscry-windows-amd64.zip.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            dist/ipscry.exe
            dist/ipscry.exe.sha256
            dist/ipscry-windows-amd64.zip
            dist/ipscry-windows-amd64.zip.sha256
            dist/ipscry-linux-amd64
            dist/ipscry-linux-amd64.sha256
            dist/ipscry-linux-amd64.tar.gz
            dist/ipscry-linux-amd64.tar.gz.sha256
          generate_release_notes: true
